services:
  - type: web
    name: mimamori-django-app
    runtime: docker
    plan: free
    dockerfilePath: ./django/Dockerfile
    dockerContext: .
    startCommand: uvicorn config.asgi:application --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: mimamori-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"

databases:
  - name: mimamori-db
    plan: free
    databaseName: mimamori_db
    user: mimamori_user