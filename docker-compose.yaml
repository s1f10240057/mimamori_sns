services:
 django:
  build: ./django
  command: uvicorn config.asgi:application --host 0.0.0.0 --port 8000
  ports:
   - 8000:8000
  volumes:
   - ./src:/code
  working_dir: /code
  depends_on:
   - db
  environment:
      - PYTHONPATH=/code
 db:
  image: postgres:15.4
  volumes:
    - postgres-data:/var/lib/postgresql/data
  environment:
    - POSTGRES_USER=iniad
    - POSTGRES_PASSWORD=password
    - POSTGRES_DB=testdb
 nginx:
   image: nginx:latest
   ports:
    - 8080:80
   volumes:
    - ./nginx:/etc/nginx/conf.d
    - ./src/collected_static:/static
   depends_on:
    - django
volumes:
  postgres-data: