<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>タイムライン</h1>
    {% if user_pair %}
    <div>
        <a href="{% querystring filter='pair' %}">
            自分のペアの画像だけ表示する
        </a>
    </div>
    {% else%}
    <p>ペアがいません！！！</p>
    {% endif %}

    <div>
        <!-- 確実にフォームの中に csrf_token を配置する -->
        <form id="uploadForm">
            {% csrf_token %}
            <input type="file" id="photo" accept="image/png, image/jpeg">
            <button type="button" id="submitBtn">投稿</button>
        </form>
    </div>

    {% if photos %}
        {% for item in photos %}
        <img src="{{ item.image.url }}" alt="投稿画像" style="max-width: 300px;">
        {% endfor %}
    {% endif %}

    <script>
        const button = document.getElementById("submitBtn");
        button.addEventListener("click", async () => {
            const fileInput = document.getElementById("photo");
            const token = document.querySelector('[name=csrfmiddlewaretoken]').value;

            // ファイルが選択されているかチェック
            if (fileInput.files.length === 0) {
                alert("ファイルを選択してください");
                return;
            }

            // FormDataを使って画像ファイルを含めたデータを構築
            const formData = new FormData();
            formData.append("photo", fileInput.files[0]); // 実際のファイルオブジェクトを追加

            try {
                const response = await fetch("{% url 'mimamori:photo' %}", {
                    method: 'POST',
                    headers: {
                        'X-CSRFToken': token
                    },
                    body: formData
                });

                if (!response.ok) {
                    throw new Error('Network response was not ok');
                }

                const data = await response.json();
                if (data.success === true) {
                    alert("アップロード成功しました！");
                    location.reload();
                } else {
                    alert("登録に失敗しました。もう一度やり直してください");
                }
            } catch (error) {
                console.error('Error:', error);
                alert("通信エラーが発生しました");
            }
        });
    </script>
</body>
</html>
