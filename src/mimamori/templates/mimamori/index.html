{% load static %}
<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <!-- <link rel="stylesheet" href="{% static 'mimamori/css/common.css' %}"> -->
</head>
<body style="background-color: rgb(250, 250, 255);">
    <p>ホーム画面</p>
    {% if user.is_authenticated %}
        {% csrf_token %}
        
        <form method="post" action="{% url 'accounts:logout' %}">
            {% csrf_token %}
            <button type="submit">Logout</button>
        </form>
    {% else %}
    <div style="height: 100vh; display: flex; flex-direction:column; align-items: center; justify-content: center; 
                border-radius: 10px;">
        <div style="font-size: 200%;">ようこそ</div>
        <div>ログイン。もしくはサインアップしてください。</div>
        <div style="display: flex; flex-direction:row; align-items: center;">
            <a href="{% url 'accounts:login' %}" style="margin: 10px">Login</a>
            <a href="{% url 'accounts:signup' %}" style="margin: 10px">Signup</a>
        </div>
        
    </div>
    {% endif %}
</body>
</html>
