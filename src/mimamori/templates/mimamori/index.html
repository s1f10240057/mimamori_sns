{% load static %}
<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <!-- <link rel="stylesheet" href="{% static 'mimamori/css/common.css' %}"> -->
</head>
<body style="background-color: rgb(250, 250, 255);">
    <p>ホーム画面</p>
    {% if user.is_authenticated %}
        {% csrf_token %}
        <p>こんにちは{{user.name}}さん！！！</p>

        <button id="pairBtn">ペア登録</button>
        <button id="friendBtn">友達登録</button>

        <div id="extraSpace" style = "display:none;">
            <div id = "window" >
                {% csrf_token %}
                <button id = "getPairTokenBtn">ペアトークンを発行</button>
                <p id = "displayToken"></p>
            </div>
        </div>
    

        <form method="post" action="{% url 'accounts:logout' %}">
            {% csrf_token %}
            <button type="submit">Logout</button>
        </form>
    {% else %}
    <div style="height: 100vh; display: flex; flex-direction:column; align-items: center; justify-content: center; 
                border-radius: 10px;">
        <div style="font-size: 200%;">ようこそ</div>
        <div>ログイン。もしくはサインアップしてください。</div>
        <div style="display: flex; flex-direction:row; align-items: center;">
            <a href="{% url 'accounts:login' %}" style="margin: 10px">Login</a>
            <a href="{% url 'accounts:signup' %}" style="margin: 10px">Signup</a>
        </div>
        
    </div>
    {% endif %}
    <script>
        const pairBtn = document.getElementById("pairBtn");
        const extraSpace = document.getElementById("extraSpace");
        pairBtn.addEventListener("click", () =>{
            extraSpace.style.display = "";
        })
        const getPairTokenBtn = document.getElementById("getPairTokenBtn");
        getPairTokenBtn.addEventListener("click", async ()=>{
            const token = document.querySelector('[name=csrfmiddlewaretoken]').value;
            try {
                const response = await fetch("{% url 'mimamori:getPairToken' %}", {
                    method: 'POST',
                    headers: {
                        'X-CSRFToken': token
                    },
                    body: null
                });

                if (!response.ok) {
                    throw new Error('Network response was not ok');
                }

                const data = await response.json();
                if (data.success === true) {
                    document.getElementById("displayToken").textContent = data.link;
                } else {
                    alert("登録に失敗しました。もう一度やり直してください");
                }
            } catch (error) {
                console.error('Error:', error);
                alert("通信エラーが発生しました");
            }
        });
    </script>
</body>
</html>
