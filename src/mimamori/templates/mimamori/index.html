{% load static %}
<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>見守りSNS</title>
    <link rel="stylesheet" href="{% static 'mimamori/css/common.css' %}">
    <link rel="stylesheet" href="{% static 'mimamori/css/timeline.css' %}">
</head>
<body>
{% if user.is_authenticated %}
    <main class="page">
        <h1 class="page-title">メニュー</h1>

        <div class="menu">
            <a href="{% url 'notifications:check_task' %}" class="btn btn-hero">タスク</a>
            <a href="{% url 'mimamori:timeline' %}" id="friendBtn" class="btn btn-large">アルバム</a>
            <a id="pairBtn" class="btn" href="{% url 'mimamori:pair' %}">友達・ペアを追加</a>
        </div>

        <form method="post" action="{% url 'accounts:logout' %}" class="menu-footer">
            {% csrf_token %}
            <button type="submit" class="btn btn-small">ログアウト</button>
        </form>
    </main>
{% else %}
    <main class="welcome">
        <div class="welcome-title">見守りSNS(仮)にようこそ！</div>
        <div class="welcome-text">ログイン、または会員登録をしてください。</div>
        <div class="welcome-actions">
            <a href="{% url 'accounts:login' %}" class="btn">ログイン</a>
            <a href="{% url 'accounts:signup' %}" class="btn">会員登録</a>
        </div>
    </main>
{% endif %}

</body>
</html>
